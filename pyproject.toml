[project]
name = "listener-letter-generator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "mcp>=1.28.1",
    "openai>=1.63.1",
    "openai-agents>=0.17.3",
    "polars>=1.42.1",
    "pydantic>=2.12.5",
    "python-dotenv>=1.0.1",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"



[dependency-groups]
dev = [
    "ruff>=0.15.10",
]
